# Render Blueprint — deploy สมอง Claude (hybrid) สำหรับ ManyChat
# วิธีง่ายสุด: กดลิงก์ Deploy to Render -> วาง ANTHROPIC_API_KEY -> Apply
services:
  - type: web
    name: sooksabay-bot
    runtime: node
    plan: starter          # ~$7/เดือน รัน 24 ชม. (Free จะหลับ)
    region: singapore      # ใกล้ไทยสุด
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false         # <- Render จะถามให้วางตอน deploy (ปลอดภัย ไม่อยู่ในโค้ด)
      - key: ANTHROPIC_MODEL
        value: claude-opus-5
      - key: SHARED_SECRET
        value: sooksabay-2ae637efe8321a88003d0f2f
